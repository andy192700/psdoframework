name: Build_Publish
on:
  workflow_dispatch:

jobs:
  windowsmacbuild:
    name: "Windows & Mac Build"

    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      id: checkout
      uses: actions/checkout@v2

    - name: Set up .NET 10 SDK
      id: dotnet_install
      if: steps.checkout.conclusion == 'success'
      uses: actions/setup-dotnet@v2
      with:
        dotnet-version: '10.0.x'

    # powershell 7.6 not yet native to github actions, temp method to accomplish such  
    # Linux + macOS
    - name: Install PowerShell 7.6 (Unix)
      id: ps_install
      if: runner.os != 'Windows' && steps.dotnet_install.conclusion == 'success'
      shell: bash
      run: |
        curl -L https://aka.ms/install-powershell.sh | sudo bash -s -- -version 7.6.0

    # Windows
    - name: Install PowerShell 7.6 (Windows)
      id: ps_installwin
      if: runner.os == 'Windows' && steps.dotnet_install.conclusion == 'success'
      shell: powershell
      run: |
        winget install --id Microsoft.PowerShell --version 7.6.0 --source winget --accept-package-agreements --accept-source-agreements

    - name: Echo PS Version
      id: echo_psversion
      if: steps.ps_install.conclusion == 'success' || steps.ps_installwin.conclusion == 'success'
      run: |
        make echopsversion

    - name: Validate makefile
      id: validate_make
      if: steps.echo_psversion.conclusion == 'success'
      run: |
        make validate

    - name: dotnet build
      id: dotnet_build
      if: steps.validate_make.conclusion == 'success'
      run: |
        make dotnetbuild psNuGetSourceName=PSGallery 

    - name: dotnet test
      id: dotnet_test
      if: steps.dotnet_build.conclusion == 'success'
      run: |
        make dotnettest

    - name: build module manifest
      id: manifest_build
      if: steps.dotnet_test.conclusion == 'success'
      run: |
        make createmanifest psNuGetSourceName=PSGallery

    - name: run powershell tests
      id: ps_tests
      if: steps.manifest_build.conclusion == 'success'
      run: |
        make pstests

  linuxbuild:
    name: "Linux Build & Publish"
    needs: windowsmacbuild
    if: success()
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      id: checkout
      uses: actions/checkout@v2

    - name: Set up .NET 8 SDK
      id: dotnet_install
      if: steps.checkout.conclusion == 'success'
      uses: actions/setup-dotnet@v2
      with:
        dotnet-version: 8.0.x

    - name: Echo PS Version
      id: echo_psversion
      if: steps.dotnet_install.conclusion == 'success'
      run: |
        make echopsversion

    - name: Validate makefile
      id: validate_make
      if: steps.echo_psversion.conclusion == 'success'
      run: |
        make validate

    - name: dotnet build
      id: dotnet_build
      if: steps.validate_make.conclusion == 'success'
      run: |
        make dotnetbuild psNuGetSourceName=PSGallery 

    - name: dotnet test
      id: dotnet_test
      if: steps.dotnet_build.conclusion == 'success'
      run: |
        make dotnettest

    - name: build module manifest
      id: manifest_build
      if: steps.dotnet_test.conclusion == 'success'
      run: |
        make createmanifest psNuGetSourceName=PSGallery

    - name: run powershell tests
      id: ps_tests
      if: steps.manifest_build.conclusion == 'success'
      run: |
        make pstests

    - name: publish module
      id: publish_module
      if: ${{ github.ref == 'refs/heads/main' && steps.ps_tests.conclusion == 'success' }}
      run: |
        make publishmodule psNuGetSourceName=PSGallery psNuGetApiKey=${{ secrets.PSGALLERY_KEY }}

    - name: publish dotnet tool
      id: publish_dotnet_tool
      if: ${{ github.ref == 'refs/heads/main' && steps.publish_module.conclusion == 'success' }}
      run: |
        make dotnetpublish nuGetGallerySourceName="https://api.nuget.org/v3/index.json" psNuGetApiKey=${{ secrets.NUGETGALLERY_KEY }}

  tag_release:
    name: "Tag Release"
    needs: linuxbuild
    if: ${{ github.ref == 'refs/heads/main' && success() }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Create Git Tag
      id: create_tag
      run: |
        make gitrelease
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN  }}