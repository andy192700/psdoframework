name: test_install
on:
  workflow_dispatch:

jobs:
  moduleinstall:
    name: "Install Module & Test"

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      id: checkout
      uses: actions/checkout@v2

    - name: install module
      id: install_module
      if: steps.checkout.conclusion == 'success'
      run: |
        make installmodule psNuGetSourceName=PSGallery

    - name: run powershell tests
      id: ps_tests_install
      if: steps.install_module.conclusion == 'success'
      run: |
        make pstestspostinstall psNuGetSourceName=PSGallery

  toolinstall:
    name: "Tool install & test"

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      id: checkout
      uses: actions/checkout@v2

    - name: Set up .NET 10 SDK
      id: dotnet_install
      if: steps.checkout.conclusion == 'success'
      uses: actions/setup-dotnet@v2
      with:
        dotnet-version: '10.0.x'

    - name: Setup PowerShell 7.6
      id: ps_install
      if: steps.dotnet_install.conclusion == 'success'
      shell: bash
      run: |
        case "${{ runner.os }}" in
          Linux)
            wget https://github.com/PowerShell/PowerShell/releases/download/v7.6.0/powershell_7.6.0-1.deb
            sudo dpkg -i powershell_7.6.0-1.deb
            ;;
          macOS)
            brew install --cask powershell
            ;;
          Windows)
            winget install --id Microsoft.PowerShell --version 7.6.0 --source winget --accept-package-agreements --accept-source-agreements
            ;;
        esac
    
    - name: install tool
      id: install_tool
      if: steps.ps_install.conclusion == 'success'
      run: |
        make installtool psNuGetSourceName=PSGallery